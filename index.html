<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer ED Competition Management</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    text-align: center;
    padding: 0 20px;
}

h1 {
    color: #004a99;
    margin-bottom: 10px;
}

.user-badge {
    display: inline-block;
    background: #e0e0e0;
    color: #333;
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* Card / Button Styles matching original index page */
.tool {
    display: inline-block;
    padding: 12px 24px;
    background: #0074e8;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: 0.2s;
    margin: 5px;
}

.tool:hover {
    background: #005bbd;
}

.tool:disabled {
    background: #a0c4f1;
    cursor: not-allowed;
}

.tool-secondary {
    background: #6c757d;
}

.tool-secondary:hover {
    background: #5a6268;
}

.tool-danger {
    background: #dc3545;
}

.tool-danger:hover {
    background: #bd2130;
}

.tool-sm {
    padding: 6px 14px;
    font-size: 14px;
    border-radius: 6px;
}

/* Auth Section */
.auth-card {
    background: #ffffff;
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.form-group {
    margin-bottom: 15px;
    text-align: left;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    color: #333;
    font-weight: bold;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.form-group input[readonly] {
    background-color: #e9ecef;
    color: #495057;
    cursor: not-allowed;
}

.error-msg {
    color: #dc3545;
    font-size: 14px;
    margin-top: 10px;
    display: none;
}

/* Header Action Bar */
.action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

/* Data Table */
.table-container {
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

th, td {
    padding: 14px 18px;
    border-bottom: 1px solid #e0e0e0;
}

th {
    background-color: #004a99;
    color: white;
    font-weight: bold;
}

tr:hover {
    background-color: #f8f9fa;
}

.link-file {
    color: #0074e8;
    text-decoration: none;
    font-weight: bold;
}

.link-file:hover {
    text-decoration: underline;
}

/* Modal Overlay & Card */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    position: relative;
    text-align: left;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.modal-header h2 {
    margin: 0;
    color: #004a99;
    font-size: 20px;
}

.close-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #888;
}

.close-btn:hover {
    color: #000;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* Loading Spinner */
.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(0, 74, 153, 0.3);
    border-radius: 50%;
    border-top-color: #004a99;
    animation: spin 1s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 8px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-container {
    padding: 30px;
    color: #666;
    font-size: 16px;
}
</style>
</head>
<body>

<!-- LOGIN VIEW -->
<div id="loginView" class="container">
    <div class="auth-card">
        <h1>Soccer ED Portal</h1>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <div id="loginError" class="error-msg">Invalid username or password.</div>
            <button type="submit" class="tool" style="width: 100%; margin: 15px 0 0 0;">Login</button>
        </form>
    </div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashboardView" class="container" style="display: none;">
    <h1>Soccer ED Competition Management</h1>
    <div id="userBadge" class="user-badge"></div>
    
    <div class="action-bar">
        <div>
            <button id="addCompBtn" class="tool" onclick="openAddModal()">+ Add Competition</button>
        </div>
        <button class="tool tool-secondary" onclick="handleLogout()">Logout</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Sport</th>
                    <th>Country</th>
                    <th>Competition</th>
                    <th>HTML File / Comparator</th>
                    <th id="actionsHeader" style="text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="competitionTableBody">
                <!-- Dynamic rows injected here -->
            </tbody>
        </table>
    </div>
</div>

<!-- ADD / EDIT COMPETITION MODAL -->
<div id="compModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Add Competition</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="compForm" onsubmit="handleSaveCompetition(event)">
            <input type="hidden" id="editDocId" value="">
            
            <div class="form-group">
                <label for="sportName">Sport Name</label>
                <input type="text" id="sportName" required>
            </div>
            
            <div class="form-group">
                <label for="countryName">Country Name</label>
                <input type="text" id="countryName" required oninput="updateGeneratedFilename()">
            </div>
            
            <div class="form-group">
                <label for="competitionName">Competition Name</label>
                <input type="text" id="competitionName" required oninput="updateGeneratedFilename()">
            </div>
            
            <div class="form-group">
                <label for="fileName">HTML File Name</label>
                <input type="text" id="fileName" readonly placeholder="Auto-generated file name">
            </div>
            
            <div id="modalError" class="error-msg">Please fill out all mandatory fields.</div>

            <div class="modal-footer">
                <button type="button" class="tool tool-secondary tool-sm" onclick="closeModal()">Cancel</button>
                <button type="submit" id="saveCompBtn" class="tool tool-sm">Save Competition</button>
            </div>
        </form>
    </div>
</div>

<!-- FIREBASE MODULE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    doc, 
    updateDoc, 
    deleteDoc, 
    onSnapshot, 
    query, 
    orderBy, 
    serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyAFNEM4kI18iWCZoz8dBqyUhLGiV0LtX9E",
  authDomain: "soccer-ed-competitions.firebaseapp.com",
  projectId: "soccer-ed-competitions",
  storageBucket: "soccer-ed-competitions.firebasestorage.app",
  messagingSenderId: "270774432669",
  appId: "1:270774432669:web:61c9fe8a6a7c2e1a277574"
};

// Initialize Firebase & Firestore
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const compCollectionRef = collection(db, "competitions");

// Global competitions cache for UI indexing/modals
let globalCompetitions = [];
let unsubscribeRealtime = null;

// User Credentials Definition
const users = [
    {
        username: "Partha Sarathy",
        password: "Radha@123",
        role: "admin"
    },
    {
        username: "Soccer ED",
        password: "Soccer@123",
        role: "user"
    }
];

// Active Session State
let currentUser = null;

document.addEventListener("DOMContentLoaded", () => {
    checkAuthState();
});

function checkAuthState() {
    const savedUser = localStorage.getItem("soccer_ed_user");
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById("loginView").style.display = "none";
        document.getElementById("dashboardView").style.display = "block";
        document.getElementById("userBadge").innerText = `Logged in as: ${currentUser.username} (${currentUser.role.toUpperCase()})`;
        
        if (currentUser.role === "admin") {
            document.getElementById("addCompBtn").style.display = "inline-block";
            document.getElementById("actionsHeader").style.display = "table-cell";
        } else {
            document.getElementById("addCompBtn").style.display = "none";
            document.getElementById("actionsHeader").style.display = "none";
        }

        subscribeToCompetitions();
    } else {
        currentUser = null;
        if (unsubscribeRealtime) {
            unsubscribeRealtime();
            unsubscribeRealtime = null;
        }
        document.getElementById("loginView").style.display = "block";
        document.getElementById("dashboardView").style.display = "none";
    }
}

// Security Guards
function isAdmin() {
    return currentUser && currentUser.role === "admin";
}

function enforceAdminAccess() {
    if (!isAdmin()) {
        alert("Access Denied. Administrator privileges required.");
        return false;
    }
    return true;
}

// Auth Handlers
window.handleLogin = function(event) {
    event.preventDefault();
    const userVal = document.getElementById("username").value.trim();
    const passVal = document.getElementById("password").value;
    const errorEl = document.getElementById("loginError");

    const match = users.find(u => u.username === userVal && u.password === passVal);

    if (match) {
        errorEl.style.display = "none";
        const sessionData = { username: match.username, role: match.role };
        localStorage.setItem("soccer_ed_user", JSON.stringify(sessionData));
        document.getElementById("loginForm").reset();
        checkAuthState();
    } else {
        errorEl.style.display = "block";
    }
};

window.handleLogout = function() {
    localStorage.removeItem("soccer_ed_user");
    checkAuthState();
};

// Firestore Realtime Subscription & Rendering
function subscribeToCompetitions() {
    const tbody = document.getElementById("competitionTableBody");
    const userIsAdmin = isAdmin();
    const colSpan = userIsAdmin ? 5 : 4;

    // Loading Indicator
    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="loading-container"><span class="spinner"></span> Loading competitions...</td></tr>`;

    const q = query(compCollectionRef, orderBy("createdAt", "asc"));

    if (unsubscribeRealtime) unsubscribeRealtime();

    unsubscribeRealtime = onSnapshot(q, (snapshot) => {
        globalCompetitions = [];
        tbody.innerHTML = "";

        if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align:center; color: #777;">No competitions found.</td></tr>`;
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const item = { id: docSnap.id, ...data };
            globalCompetitions.push(item);

            const row = document.createElement("tr");
            
            let actionsHtml = "";
            if (userIsAdmin) {
                actionsHtml = `
                    <td style="text-align: center;">
                        <button class="tool tool-sm" onclick="openEditModal('${docSnap.id}')">Edit</button>
                        <button class="tool tool-danger tool-sm" onclick="deleteCompetition('${docSnap.id}')">Delete</button>
                    </td>
                `;
            }

            row.innerHTML = `
                <td>${escapeHtml(item.sport || '')}</td>
                <td>${escapeHtml(item.country || '')}</td>
                <td>${escapeHtml(item.competition || '')}</td>
                <td>
                    <a class="link-file" href="${escapeHtml(item.file || '')}" target="_blank" title="Open ${escapeHtml(item.competition || '')} Comparator">
                        Open ${escapeHtml(item.file || '')}
                    </a>
                </td>
                ${actionsHtml}
            `;
            tbody.appendChild(row);
        });
    }, (error) => {
        console.error("Error fetching competitions from Firestore: ", error);
        tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align:center; color: #dc3545;">Failed to load data from Firestore.</td></tr>`;
    });
}

// Auto Filename Generator
function generateFileName(country, competition) {
    if (!country && !competition) return "";
    
    const sanitize = (str) => str
        .replace(/[^a-zA-Z0-9\s]/g, "")
        .trim()
        .replace(/\s+/g, "_");

    const cleanCountry = sanitize(country);
    const cleanComp = sanitize(competition);

    if (cleanCountry && cleanComp) {
        return `${cleanCountry}_${cleanComp}.html`;
    } else if (cleanCountry) {
        return `${cleanCountry}.html`;
    } else if (cleanComp) {
        return `${cleanComp}.html`;
    }
    return "";
}

window.updateGeneratedFilename = function() {
    const country = document.getElementById("countryName").value;
    const comp = document.getElementById("competitionName").value;
    document.getElementById("fileName").value = generateFileName(country, comp);
};

// Modal Operations
window.openAddModal = function() {
    if (!enforceAdminAccess()) return;

    document.getElementById("modalTitle").innerText = "Add Competition";
    document.getElementById("editDocId").value = "";
    document.getElementById("compForm").reset();
    document.getElementById("sportName").value = "Soccer";
    document.getElementById("modalError").style.display = "none";
    document.getElementById("compModal").style.display = "flex";
    window.updateGeneratedFilename();
};

window.openEditModal = function(docId) {
    if (!enforceAdminAccess()) return;

    const item = globalCompetitions.find(c => c.id === docId);
    if (!item) return;

    document.getElementById("modalTitle").innerText = "Edit Competition";
    document.getElementById("editDocId").value = docId;
    document.getElementById("sportName").value = item.sport;
    document.getElementById("countryName").value = item.country;
    document.getElementById("competitionName").value = item.competition;
    document.getElementById("modalError").style.display = "none";
    window.updateGeneratedFilename();
    document.getElementById("compModal").style.display = "flex";
};

window.closeModal = function() {
    document.getElementById("compModal").style.display = "none";
};

// Create / Update Firestore Actions
window.handleSaveCompetition = async function(event) {
    event.preventDefault();
    if (!enforceAdminAccess()) return;

    const sport = document.getElementById("sportName").value.trim();
    const country = document.getElementById("countryName").value.trim();
    const competition = document.getElementById("competitionName").value.trim();
    const file = document.getElementById("fileName").value.trim();
    const docId = document.getElementById("editDocId").value;
    const errorEl = document.getElementById("modalError");
    const saveBtn = document.getElementById("saveCompBtn");

    if (!sport || !country || !competition || !file) {
        errorEl.innerText = "Please fill out all mandatory fields.";
        errorEl.style.display = "block";
        return;
    }

    errorEl.style.display = "none";
    const originalBtnText = saveBtn.innerText;
    saveBtn.disabled = true;
    saveBtn.innerText = "Saving...";

    try {
        if (docId) {
            // Update Firestore Doc
            const docRef = doc(db, "competitions", docId);
            await updateDoc(docRef, {
                sport,
                country,
                competition,
                file
            });
        } else {
            // Add Firestore Doc
            await addDoc(compCollectionRef, {
                sport,
                country,
                competition,
                file,
                createdAt: serverTimestamp()
            });
        }
        window.closeModal();
    } catch (err) {
        console.error("Firestore Save Error: ", err);
        errorEl.innerText = "Error saving data. Please try again.";
        errorEl.style.display = "block";
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = originalBtnText;
    }
};

// Delete Firestore Action
window.deleteCompetition = async function(docId) {
    if (!enforceAdminAccess()) return;

    if (confirm("Are you sure you want to delete this competition?")) {
        try {
            const docRef = doc(db, "competitions", docId);
            await deleteDoc(docRef);
        } catch (err) {
            console.error("Firestore Delete Error: ", err);
            alert("Failed to delete the competition. Please try again.");
        }
    }
};

// XSS Prevention Utility
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
